description: Kiểm thử và đánh giá tự động RAG MoMo (Config A vs Config B) 50 câu hỏi
  bằng Promptfoo
prompts:
- '{{question}}'
providers:
- id: python:eval/promptfoo_provider.py:call_rag_A
  label: MoMo RAG - Config A (Chunk 500, k=3)
- id: python:eval/promptfoo_provider.py:call_rag_B
  label: MoMo RAG - Config B (Chunk 1000, k=5)
tests:
- vars:
    id: q_001
    question: Người sử dụng từ đủ 15 tuổi đến chưa đủ 18 tuổi có được mở tài khoản
      MoMo không?
    gold_answer: Người sử dụng từ đủ 15 tuổi đến chưa đủ 18 tuổi và không bị mất,
      hạn chế năng lực hành vi dân sự được đăng ký, mở và sử dụng tài khoản theo quy
      định của MoMo phù hợp pháp luật.
    gold_doc_ids:
    - momo_terms
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_002
    question: Hạn mức giao dịch và hạn mức ngày mặc định khi liên kết dịch vụ trên
      MoMo là bao nhiêu?
    gold_answer: Hạn mức giao dịch mặc định tối đa là 50.000đ và hạn mức ngày mặc
      định tối đa là 250.000đ mỗi ngày cho các giao dịch từ một tài khoản đối tác
      đã liên kết.
    gold_doc_ids:
    - momo_linking
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_003
    question: Ví MoMo có hỗ trợ tính năng mua bán tiền điện tử Bitcoin không?
    gold_answer: ''
    gold_doc_ids: []
    answerable: false
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_004
    question: Có đúng là sau khi liên kết tài khoản dịch vụ thì mỗi lần thanh toán
      người dùng vẫn phải mở ứng dụng MoMo để bấm xác nhận không?
    gold_answer: Không đúng. Sau khi liên kết thành công, các giao dịch thanh toán
      sau này sẽ tự động trừ tiền từ Ví MoMo mà không cần phải xác nhận gì thêm trên
      Ứng dụng MoMo.
    gold_doc_ids:
    - momo_linking
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_005
    question: Chào bạn, cho tôi biết MoMo là ứng dụng gì?
    gold_answer: MoMo là ứng dụng Ví điện tử thuộc quyền sở hữu của Công ty Cổ phần
      Dịch vụ Di Động Trực Tuyến (M_Service).
    gold_doc_ids:
    - momo_linking
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_006
    question: Số dư tối đa của Tài Khoản Ví Điện Tử MoMo tại mọi thời điểm là bao
      nhiêu?
    gold_answer: Số dư tối đa của Tài Khoản Ví Điện Tử là 200.000.000 đồng tại mọi
      thời điểm theo chính sách quản lý rủi ro của MoMo.
    gold_doc_ids:
    - momo_terms
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_007
    question: Tổng hạn mức giao dịch chuyển tiền và thanh toán qua các tài khoản Ví
      cá nhân của một người dùng tối đa là bao nhiêu một tháng?
    gold_answer: Tổng hạn mức giao dịch (chuyển tiền và thanh toán) qua các Tài Khoản
      Ví Điện Tử cá nhân của 01 Người Sử Dụng tối đa là 100.000.000 đồng/tháng.
    gold_doc_ids:
    - momo_terms
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_008
    question: Hạn mức bổ sung tối đa cho nhóm giao dịch thanh toán đặc thù (điện,
      nước, viễn thông, học phí, viện phí) là bao nhiêu một tháng?
    gold_answer: Tổng hạn mức cho nhóm giao dịch thanh toán đặc thù không vượt quá
      300.000.000 đồng/tháng.
    gold_doc_ids:
    - momo_terms
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_009
    question: Công ty chủ quản sở hữu và vận hành ví MoMo có tên đầy đủ là gì?
    gold_answer: Công Ty Cổ Phần Dịch Vụ Di Động Trực Tuyến (M_Service).
    gold_doc_ids:
    - momo_terms
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_010
    question: Hồ sơ mở tài khoản MoMo tối thiểu bao gồm những thông tin nào?
    gold_answer: 'Hồ Sơ Mở Tài Khoản gồm tối thiểu: họ và tên; ngày, tháng, năm sinh;
      quốc tịch; số điện thoại; số định danh cá nhân hoặc giấy tờ tùy thân còn hiệu
      lực; dữ liệu sinh trắc học.'
    gold_doc_ids:
    - momo_terms
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_011
    question: Hạn mức giao dịch liên kết tối thiểu và tối đa trên MoMo có thể cài
      đặt là bao nhiêu?
    gold_answer: Hạn mức tối thiểu là 25.000đ và hạn mức tối đa là không giới hạn
      (áp dụng theo hạn mức tối đa của Ví MoMo).
    gold_doc_ids:
    - momo_linking
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_012
    question: Hạn mức ngày tối thiểu khi liên kết tài khoản đối tác trên MoMo là bao
      nhiêu?
    gold_answer: Hạn mức tối thiểu là 150.000đ và hạn mức tối đa là không giới hạn.
    gold_doc_ids:
    - momo_linking
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_013
    question: Người dùng có thể hủy dịch vụ liên kết tài khoản ở đâu?
    gold_answer: Quý khách có thể hủy dịch vụ liên kết bất kỳ lúc nào ngay trên Ứng
      dụng Ví điện tử MoMo hoặc hủy ở web, ứng dụng của Nhà cung cấp dịch vụ.
    gold_doc_ids:
    - momo_linking
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_014
    question: MoMo có hướng đến người dùng dưới 15 tuổi hay không?
    gold_answer: MoMo không hướng đến người dưới 15 tuổi.
    gold_doc_ids:
    - momo_privacy
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_015
    question: Việc xử lý dữ liệu cá nhân của người dưới 15 tuổi trên MoMo được thực
      hiện qua ai?
    gold_answer: Được thực hiện thông qua người đại diện theo pháp luật theo quy định.
    gold_doc_ids:
    - momo_privacy
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_016
    question: Chủ thể dữ liệu có quyền yêu cầu xóa dữ liệu cá nhân của mình trên MoMo
      không?
    gold_answer: Có, chủ thể dữ liệu có quyền yêu cầu xóa dữ liệu trong phạm vi pháp
      luật cho phép.
    gold_doc_ids:
    - momo_privacy
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_017
    question: Chủ thể dữ liệu có quyền rút lại sự đồng ý cho phép xử lý dữ liệu cá
      nhân trên MoMo không?
    gold_answer: Có, người dùng có quyền rút lại sự đồng ý theo quy định pháp luật
      về bảo vệ dữ liệu cá nhân.
    gold_doc_ids:
    - momo_privacy
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_018
    question: Người sử dụng nạp tiền vào Tài khoản ví điện tử MoMo thông qua những
      kênh nào?
    gold_answer: Thông qua nhận tiền từ Tài Khoản Ngân Hàng Liên Kết, nhận tiền từ
      tài khoản thanh toán ngân hàng, từ Tài Khoản Ví Điện Tử khác hoặc ví điện tử
      khác khi pháp luật cho phép.
    gold_doc_ids:
    - momo_terms
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_019
    question: Ngày làm việc theo quy định trong Điều khoản chung của MoMo là những
      ngày nào?
    gold_answer: Là các ngày từ Thứ Hai đến Thứ Sáu, không bao gồm ngày nghỉ, lễ,
      Tết theo quy định pháp luật.
    gold_doc_ids:
    - momo_terms
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_020
    question: Người sử dụng có bắt buộc phải duy trì liên kết với tài khoản ngân hàng
      trong suốt thời gian sử dụng ví MoMo không?
    gold_answer: Có, Người Sử Dụng phải hoàn thành việc liên kết và duy trì liên kết
      trong suốt thời gian sử dụng Tài Khoản Ví Điện Tử trừ trường hợp pháp luật quy
      định khác.
    gold_doc_ids:
    - momo_terms
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_021
    question: Biện pháp xác thực sinh trắc học trên MoMo đối chiếu khớp đúng thông
      tin với những nguồn nào?
    gold_answer: Đối chiếu khớp đúng thông tin sinh trắc học với dữ liệu trong giấy
      tờ tùy thân, danh tính điện tử (tài khoản định danh điện tử VneID) hoặc cơ sở
      dữ liệu có thẩm quyền.
    gold_doc_ids:
    - momo_terms
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_022
    question: Điều khoản chung mở và sử dụng tài khoản MoMo áp dụng chính thức từ
      ngày nào?
    gold_answer: Áp dụng từ ngày 30/09/2026.
    gold_doc_ids:
    - momo_terms
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_023
    question: MoMo thu thập những loại dữ liệu cá nhân cơ bản nào của khách hàng?
    gold_answer: Bao gồm thông tin định danh cá nhân, thông tin liên lạc, thông tin
      tài khoản dịch vụ, thông tin sinh trắc học và thông tin tài chính.
    gold_doc_ids:
    - momo_privacy
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_024
    question: M_Service có chịu trách nhiệm về chất lượng sản phẩm do Nhà cung cấp
      dịch vụ cung cấp khi liên kết không?
    gold_answer: Không, M_Service là trung gian thanh toán và không chịu bất kỳ trách
      nhiệm liên quan nào về sản phẩm, dịch vụ do Nhà cung cấp dịch vụ cung cấp.
    gold_doc_ids:
    - momo_linking
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_025
    question: Chào bạn, cho mình hỏi MoMo hỗ trợ chăm sóc khách hàng qua số tổng đài
      hotline nào vậy?
    gold_answer: MoMo hỗ trợ chăm sóc khách hàng qua Hotline 1900 5454 41.
    gold_doc_ids:
    - momo_privacy
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_026
    question: Người từ đủ 15 đến dưới 18 tuổi cần đáp ứng điều kiện gì về năng lực
      hành vi và người đại diện để đăng ký sử dụng MoMo?
    gold_answer: Người sử dụng từ đủ 15 đến dưới 18 tuổi phải không bị mất hoặc hạn
      chế năng lực hành vi dân sự, đồng thời tùy theo dịch vụ có thể cần thêm sự chấp
      thuận của người đại diện theo pháp luật.
    gold_doc_ids:
    - momo_terms
    - momo_privacy
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_027
    question: Nếu giấy tờ tùy thân của khách hàng hết hiệu lực hoặc không cập nhật
      thông tin định danh thì MoMo có quyền áp dụng những biện pháp gì?
    gold_answer: MoMo có thể hạn chế, tạm ngừng, từ chối thực hiện một phần hoặc toàn
      bộ giao dịch, hoặc đóng tài khoản của khách hàng.
    gold_doc_ids:
    - momo_terms
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_028
    question: Người dùng có thể nạp tiền vào ví MoMo từ những nguồn nào và sau khi
      nạp có thể dùng số dư để chi trả cho những mục đích nào?
    gold_answer: Nạp tiền từ tài khoản ngân hàng liên kết hoặc ví điện tử khác; sau
      đó có thể rút về tài khoản ngân hàng, chuyển tiền hoặc thanh toán sản phẩm,
      dịch vụ và nộp dịch vụ công.
    gold_doc_ids:
    - momo_terms
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_029
    question: Khi hủy dịch vụ liên kết tài khoản đối tác, quan hệ thanh toán qua MoMo
      và các cam kết riêng với đối tác bị ảnh hưởng như thế nào?
    gold_answer: Sau khi hủy, người dùng không thể tiếp tục dùng Ví MoMo để thanh
      toán trên dịch vụ đó, nhưng việc hủy không ảnh hưởng đến các cam kết riêng của
      người dùng với Nhà cung cấp dịch vụ.
    gold_doc_ids:
    - momo_linking
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_030
    question: Trong trường hợp nào MoMo có quyền trích nợ, khấu trừ hoặc thu hồi tiền
      từ tài khoản người dùng?
    gold_answer: Khi có giao dịch và phí người dùng đã xác nhận, hoặc tiền ghi có
      nhầm do sai sót kỹ thuật, hoặc nghĩa vụ theo yêu cầu hợp pháp của cơ quan nhà
      nước có thẩm quyền.
    gold_doc_ids:
    - momo_terms
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_031
    question: MoMo chia sẻ dữ liệu cá nhân của người dùng trong những trường hợp nào?
    gold_answer: MoMo chỉ chia sẻ dữ liệu cá nhân trong phạm vi cần thiết để cung
      cấp dịch vụ, tuân thủ nghĩa vụ pháp luật, hoặc khi được Người dùng đồng ý.
    gold_doc_ids:
    - momo_privacy
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_032
    question: Người dùng cần làm những bước gì để từ một tài khoản MoMo cơ bản trở
      thành Tài khoản Ví điện tử MoMo chính thức?
    gold_answer: Người dùng cần hoàn tất quy trình đăng ký, định danh, xác thực thông
      tin (bao gồm sinh trắc học) và liên kết với tài khoản ngân hàng của chính mình.
    gold_doc_ids:
    - momo_terms
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_033
    question: Trách nhiệm bồi thường tổn thất trong trường hợp xảy ra giao dịch trái
      phép trên MoMo được phân định như thế nào?
    gold_answer: Được xác định trên cơ sở lỗi của các bên. Người dùng không chịu trách
      nhiệm nếu tổn thất do lỗi hoặc sự cố hệ thống của MoMo, và MoMo có trách nhiệm
      bồi hoàn.
    gold_doc_ids:
    - momo_terms
    answerable: true
  assert:
  - type: python
    value: file://eval/promptfoo_assertions.py
- vars:
    id: q_034
    question: Thủ tục xin cấp visa định cư tại Canada qua ứng dụng MoMo gồm những
